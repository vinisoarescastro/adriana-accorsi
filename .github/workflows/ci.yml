name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formatação
        run: npm run format:conferir
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Front (build)
        run: npm run build -w @gabinete/web
      # A integração sobe Postgres e um servidor S3 em contêiner (Docker já vem no executor).
      - name: Testes (unidade, interface e integração)
        run: npm test
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  # Só em push para main, depois que tudo passou: publica as imagens no GHCR.
  imagens:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome do repositório em minúsculas
        id: nome
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.nome.outputs.repo }}/api:main
            ghcr.io/${{ steps.nome.outputs.repo }}/api:${{ github.sha }}
      - name: Imagem do app público
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.publico
          push: true
          tags: |
            ghcr.io/${{ steps.nome.outputs.repo }}/publico:main
            ghcr.io/${{ steps.nome.outputs.repo }}/publico:${{ github.sha }}
      - name: Imagem do worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.nome.outputs.repo }}/worker:main
            ghcr.io/${{ steps.nome.outputs.repo }}/worker:${{ github.sha }}
      - name: Imagem do Caddy (com a SPA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.caddy
          push: true
          tags: |
            ghcr.io/${{ steps.nome.outputs.repo }}/caddy:main
            ghcr.io/${{ steps.nome.outputs.repo }}/caddy:${{ github.sha }}
