# Produção (VPS). Só o Caddy publica portas. Segredos ficam em .env.producao (fora do repositório).
# O app público e o worker NÃO usam env_file: recebem só o que precisam (o público nunca vê o segredo
# da aplicação nem as credenciais do armazenamento). Por isso os scripts passam --env-file .env.producao
# ao compose, para a interpolação das variáveis abaixo.

name: gabinete

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.producao
    environment:
      POSTGRES_DB: gabinete
      TZ: America/Sao_Paulo
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d gabinete']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só é alcançável pelos outros serviços desta rede.

  # Antivírus: obrigatório em produção. Sem portas publicadas; só a API fala com ele.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_dados:/var/lib/clamav

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    image: ${IMAGEM_API:-gabinete-api:local}
    restart: unless-stopped
    env_file: .env.producao
    environment:
      NODE_ENV: production
      HOST_API: 0.0.0.0
      PORTA_API: '3000'
      CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    # Sem "ports": só o Caddy fala com a API.

  # Área pública do cidadão: só lê as visões públicas, com o papel app_publico. Sem portas publicadas.
  publico:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.publico
    image: ${IMAGEM_PUBLICO:-gabinete-publico:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME_APP: ${HOSTNAME_APP}
      HOSTNAME_PUBLICO: ${HOSTNAME_PUBLICO}
      DATABASE_URL_PUBLICO: ${DATABASE_URL_PUBLICO}
      HOST_PUBLICO: 0.0.0.0
      PORTA_PUBLICO: '3100'
    depends_on:
      postgres:
        condition: service_healthy

  # Worker: envia os e-mails da fila (outbox). Só fala com o banco (papel app_worker) e com o provedor.
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    image: ${IMAGEM_WORKER:-gabinete-worker:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME_APP: ${HOSTNAME_APP}
      HOSTNAME_PUBLICO: ${HOSTNAME_PUBLICO}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER}
      SESSAO_SEGREDO: ${SESSAO_SEGREDO}
      EMAIL_PROVEDOR: ${EMAIL_PROVEDOR:-resend}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE}
      LIMITE_EMAILS_POR_HORA: ${LIMITE_EMAILS_POR_HORA:-30}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.caddy
    image: ${IMAGEM_CADDY:-gabinete-caddy:local}
    restart: unless-stopped
    env_file: .env.producao
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - api
      - publico

volumes:
  postgres_dados:
  clamav_dados:
  caddy_dados:
  caddy_config:
